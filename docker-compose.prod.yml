# Production: images come from GitHub Container Registry (built by .github/workflows/deploy.yml).
# Only Caddy is reachable from the internet; it serves HTTPS and forwards /auth to Keycloak, the rest to the Angular/nginx container.
name: factorymind

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: factorymind
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      retries: 10

  # Creates the per-service databases that are missing, then exits.
  db-init:
    image: postgres:17-alpine
    command: psql -v ON_ERROR_STOP=1 -h postgres -U ${POSTGRES_USER} -d factorymind -f /init-databases.sql
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./infrastructure/postgres/init-databases.sql:/init-databases.sql:ro
    depends_on:
      postgres:
        condition: service_healthy

  # Not published on the host: only the services on this Docker network reach it.
  kafka:
    image: apache/kafka:4.3.1
    restart: unless-stopped
    environment:
      CLUSTER_ID: ${KAFKA_CLUSTER_ID}
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: -Xmx512m -Xms512m
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null"]
      interval: 10s
      timeout: 10s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    restart: unless-stopped
    command: start --import-realm --http-relative-path=/auth
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak_db
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      # Caddy terminates HTTPS and serves Keycloak at https://$DOMAIN/auth.
      KC_HOSTNAME: https://${DOMAIN}/auth
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: "true"
      # Read by the realm file: the web client only accepts redirects back to this origin.
      WEB_ORIGIN: https://${DOMAIN}
    volumes:
      - ./infrastructure/keycloak/factorymind-realm.json:/opt/keycloak/data/import/factorymind-realm.json:ro
    depends_on:
      db-init:
        condition: service_completed_successfully

  asset-service:
    image: ${IMAGE_PREFIX}/asset-service:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      ASSET_DB_URL: jdbc:postgresql://postgres:5432/asset_db
      ASSET_DB_USER: ${POSTGRES_USER}
      ASSET_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KEYCLOAK_ISSUER_URI: https://${DOMAIN}/auth/realms/factorymind
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/auth/realms/factorymind/protocol/openid-connect/certs
    depends_on:
      db-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy

  telemetry-service:
    image: ${IMAGE_PREFIX}/telemetry-service:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      TELEMETRY_DB_URL: jdbc:postgresql://postgres:5432/telemetry_db
      TELEMETRY_DB_USER: ${POSTGRES_USER}
      TELEMETRY_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KEYCLOAK_ISSUER_URI: https://${DOMAIN}/auth/realms/factorymind
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/auth/realms/factorymind/protocol/openid-connect/certs
      # The public demo has no real plant behind it.
      SIMULATOR_ENABLED: ${SIMULATOR_ENABLED:-true}
    depends_on:
      db-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy

  alert-service:
    image: ${IMAGE_PREFIX}/alert-service:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      ALERT_DB_URL: jdbc:postgresql://postgres:5432/alert_db
      ALERT_DB_USER: ${POSTGRES_USER}
      ALERT_DB_PASSWORD: ${POSTGRES_PASSWORD}
      ALERT_RAISE_AFTER: ${ALERT_RAISE_AFTER:-PT15S}
      ALERT_CLEAR_AFTER: ${ALERT_CLEAR_AFTER:-PT30S}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KEYCLOAK_ISSUER_URI: https://${DOMAIN}/auth/realms/factorymind
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/auth/realms/factorymind/protocol/openid-connect/certs
    depends_on:
      db-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy

  maintenance-service:
    image: ${IMAGE_PREFIX}/maintenance-service:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      MAINTENANCE_DB_URL: jdbc:postgresql://postgres:5432/maintenance_db
      MAINTENANCE_DB_USER: ${POSTGRES_USER}
      MAINTENANCE_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      INVENTORY_SERVICE_URL: http://inventory-service:8086
      KEYCLOAK_ISSUER_URI: https://${DOMAIN}/auth/realms/factorymind
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/auth/realms/factorymind/protocol/openid-connect/certs
    depends_on:
      db-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      inventory-service:
        condition: service_started

  inventory-service:
    image: ${IMAGE_PREFIX}/inventory-service:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      INVENTORY_DB_URL: jdbc:postgresql://postgres:5432/inventory_db
      INVENTORY_DB_USER: ${POSTGRES_USER}
      INVENTORY_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KEYCLOAK_ISSUER_URI: https://${DOMAIN}/auth/realms/factorymind
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/auth/realms/factorymind/protocol/openid-connect/certs
    depends_on:
      db-init:
        condition: service_completed_successfully

  ml-service:
    image: ${IMAGE_PREFIX}/ml-service:${IMAGE_TAG:-latest}
    restart: unless-stopped

  ai-insights-service:
    image: ${IMAGE_PREFIX}/ai-insights-service:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      INSIGHTS_DB_URL: jdbc:postgresql://postgres:5432/insights_db
      INSIGHTS_DB_USER: ${POSTGRES_USER}
      INSIGHTS_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      ML_SERVICE_URL: http://ml-service:8090
      ASSET_SERVICE_URL: http://asset-service:8081
      # The public demo writes rule-based reports unless a key is set in .env.
      AI_CHAT_PROVIDER: ${AI_CHAT_PROVIDER:-none}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5-5}
      KEYCLOAK_ISSUER_URI: https://${DOMAIN}/auth/realms/factorymind
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/auth/realms/factorymind/protocol/openid-connect/certs
    depends_on:
      db-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      ml-service:
        condition: service_healthy

  api-gateway:
    image: ${IMAGE_PREFIX}/api-gateway:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      ASSET_SERVICE_URL: http://asset-service:8081
      TELEMETRY_SERVICE_URL: http://telemetry-service:8082
      ALERT_SERVICE_URL: http://alert-service:8083
      MAINTENANCE_SERVICE_URL: http://maintenance-service:8084
      INVENTORY_SERVICE_URL: http://inventory-service:8086
      AI_INSIGHTS_SERVICE_URL: http://ai-insights-service:8087
      CORS_ALLOWED_ORIGINS: https://${DOMAIN}
      KEYCLOAK_ISSUER_URI: https://${DOMAIN}/auth/realms/factorymind
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/auth/realms/factorymind/protocol/openid-connect/certs
    depends_on:
      - asset-service
      - telemetry-service
      - alert-service
      - maintenance-service
      - inventory-service
      - ai-insights-service

  web:
    image: ${IMAGE_PREFIX}/web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - api-gateway

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - web
      - keycloak

volumes:
  postgres-data:
  kafka-data:
  caddy-data:
