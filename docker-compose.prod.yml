# Production: images come from GitHub Container Registry (built by .github/workflows/deploy.yml).
# Only Caddy is reachable from the internet; it serves HTTPS and forwards /auth to Keycloak, the rest to the Angular/nginx container.
name: factorymind

# Shared by every Spring Boot service: traces to Tempo; metrics are pulled by Prometheus on the private network.
x-observability: &observability
  MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT: http://tempo:4318/v1/traces
  TRACING_SAMPLING_PROBABILITY: ${TRACING_SAMPLING_PROBABILITY:-0.2}

services:
  postgres:
    # Postgres 17 with the pgvector extension (embeddings of the copilot's knowledge base).
    image: pgvector/pgvector:0.8.1-pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: factorymind
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      retries: 10

  # Creates the per-service databases that are missing, then exits.
  db-init:
    image: postgres:17-alpine
    command: psql -v ON_ERROR_STOP=1 -h postgres -U ${POSTGRES_USER} -d factorymind -f /init-databases.sql
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./infrastructure/postgres/init-databases.sql:/init-databases.sql:ro
    depends_on:
      postgres:
        condition: service_healthy

  # Not published on the host: only the services on this Docker network reach it.
  kafka:
    image: apache/kafka:4.3.1
    restart: unless-stopped
    environment:
      CLUSTER_ID: ${KAFKA_CLUSTER_ID}
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: -Xmx512m -Xms512m
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null"]
      interval: 10s
      timeout: 10s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    restart: unless-stopped
    command: start --import-realm --http-relative-path=/auth
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak_db
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      # Caddy terminates HTTPS and serves Keycloak at https://$DOMAIN/auth.
      KC_HOSTNAME: https://${DOMAIN}/auth
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: "true"
      # Read by the realm file: the web client only accepts redirects back to this origin.
      WEB_ORIGIN: https://${DOMAIN}
      # Read by the realm file: secret of notification-service's own login (client credentials).
      NOTIFICATION_CLIENT_SECRET: ${NOTIFICATION_CLIENT_SECRET:?set NOTIFICATION_CLIENT_SECRET in .env}
    volumes:
      - ./infrastructure/keycloak/factorymind-realm.json:/opt/keycloak/data/import/factorymind-realm.json:ro
    depends_on:
      db-init:
        condition: service_completed_successfully

  asset-service:
    image: ${IMAGE_PREFIX}/asset-service:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      <<: *observability
      ASSET_DB_URL: jdbc:postgresql://postgres:5432/asset_db
      ASSET_DB_USER: ${POSTGRES_USER}
      ASSET_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KEYCLOAK_ISSUER_URI: https://${DOMAIN}/auth/realms/factorymind
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/auth/realms/factorymind/protocol/openid-connect/certs
    depends_on:
      db-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy

  telemetry-service:
    image: ${IMAGE_PREFIX}/telemetry-service:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      <<: *observability
      TELEMETRY_DB_URL: jdbc:postgresql://postgres:5432/telemetry_db
      TELEMETRY_DB_USER: ${POSTGRES_USER}
      TELEMETRY_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KEYCLOAK_ISSUER_URI: https://${DOMAIN}/auth/realms/factorymind
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/auth/realms/factorymind/protocol/openid-connect/certs
      # The public demo has no real plant behind it.
      SIMULATOR_ENABLED: ${SIMULATOR_ENABLED:-true}
    depends_on:
      db-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy

  alert-service:
    image: ${IMAGE_PREFIX}/alert-service:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      <<: *observability
      ALERT_DB_URL: jdbc:postgresql://postgres:5432/alert_db
      ALERT_DB_USER: ${POSTGRES_USER}
      ALERT_DB_PASSWORD: ${POSTGRES_PASSWORD}
      ALERT_RAISE_AFTER: ${ALERT_RAISE_AFTER:-PT15S}
      ALERT_CLEAR_AFTER: ${ALERT_CLEAR_AFTER:-PT30S}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KEYCLOAK_ISSUER_URI: https://${DOMAIN}/auth/realms/factorymind
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/auth/realms/factorymind/protocol/openid-connect/certs
    depends_on:
      db-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy

  maintenance-service:
    image: ${IMAGE_PREFIX}/maintenance-service:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      <<: *observability
      MAINTENANCE_DB_URL: jdbc:postgresql://postgres:5432/maintenance_db
      MAINTENANCE_DB_USER: ${POSTGRES_USER}
      MAINTENANCE_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      INVENTORY_SERVICE_URL: http://inventory-service:8086
      KEYCLOAK_ISSUER_URI: https://${DOMAIN}/auth/realms/factorymind
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/auth/realms/factorymind/protocol/openid-connect/certs
    depends_on:
      db-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      inventory-service:
        condition: service_started

  inventory-service:
    image: ${IMAGE_PREFIX}/inventory-service:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      <<: *observability
      INVENTORY_DB_URL: jdbc:postgresql://postgres:5432/inventory_db
      INVENTORY_DB_USER: ${POSTGRES_USER}
      INVENTORY_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KEYCLOAK_ISSUER_URI: https://${DOMAIN}/auth/realms/factorymind
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/auth/realms/factorymind/protocol/openid-connect/certs
    depends_on:
      db-init:
        condition: service_completed_successfully

  ml-service:
    image: ${IMAGE_PREFIX}/ml-service:${IMAGE_TAG:-latest}
    restart: unless-stopped

  ai-insights-service:
    image: ${IMAGE_PREFIX}/ai-insights-service:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      <<: *observability
      INSIGHTS_DB_URL: jdbc:postgresql://postgres:5432/insights_db
      INSIGHTS_DB_USER: ${POSTGRES_USER}
      INSIGHTS_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      ML_SERVICE_URL: http://ml-service:8090
      ASSET_SERVICE_URL: http://asset-service:8081
      # The public demo writes rule-based reports unless a key is set in .env. Without Ollama the copilot
      # searches the manuals by keywords only (Postgres full-text search).
      AI_CHAT_PROVIDER: ${AI_CHAT_PROVIDER:-none}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5-5}
      KEYCLOAK_ISSUER_URI: https://${DOMAIN}/auth/realms/factorymind
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/auth/realms/factorymind/protocol/openid-connect/certs
    depends_on:
      db-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      ml-service:
        condition: service_healthy

  analytics-service:
    image: ${IMAGE_PREFIX}/analytics-service:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      <<: *observability
      ANALYTICS_DB_URL: jdbc:postgresql://postgres:5432/analytics_db
      ANALYTICS_DB_USER: ${POSTGRES_USER}
      ANALYTICS_DB_PASSWORD: ${POSTGRES_PASSWORD}
      ASSET_DB_URL: jdbc:postgresql://postgres:5432/asset_db
      TELEMETRY_DB_URL: jdbc:postgresql://postgres:5432/telemetry_db
      ALERT_DB_URL: jdbc:postgresql://postgres:5432/alert_db
      MAINTENANCE_DB_URL: jdbc:postgresql://postgres:5432/maintenance_db
      INSIGHTS_DB_URL: jdbc:postgresql://postgres:5432/insights_db
      SOURCE_DB_USER: ${POSTGRES_USER}
      SOURCE_DB_PASSWORD: ${POSTGRES_PASSWORD}
      ANALYTICS_DEMO_HISTORY: ${ANALYTICS_DEMO_HISTORY:-true}
      POWERBI_REPORT_URL: ${POWERBI_REPORT_URL:-}
      KEYCLOAK_ISSUER_URI: https://${DOMAIN}/auth/realms/factorymind
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/auth/realms/factorymind/protocol/openid-connect/certs
    depends_on:
      db-init:
        condition: service_completed_successfully

  notification-service:
    image: ${IMAGE_PREFIX}/notification-service:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      <<: *observability
      NOTIFICATION_DB_URL: jdbc:postgresql://postgres:5432/notification_db
      NOTIFICATION_DB_USER: ${POSTGRES_USER}
      NOTIFICATION_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # A real mail server in production (Mailpit is for development only).
      MAIL_HOST: ${MAIL_HOST:?set MAIL_HOST in .env}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-true}
      MAIL_STARTTLS: ${MAIL_STARTTLS:-true}
      MAIL_FROM: ${MAIL_FROM:-FactoryMind AI <notifications@${DOMAIN}>}
      APP_PUBLIC_URL: https://${DOMAIN}
      ALERTMANAGER_WEBHOOK_TOKEN: ${ALERTMANAGER_WEBHOOK_TOKEN:?set ALERTMANAGER_WEBHOOK_TOKEN in .env}
      ASSET_SERVICE_URL: http://asset-service:8081
      NOTIFICATION_CLIENT_SECRET: ${NOTIFICATION_CLIENT_SECRET:?set NOTIFICATION_CLIENT_SECRET in .env}
      KEYCLOAK_TOKEN_URI: http://keycloak:8080/auth/realms/factorymind/protocol/openid-connect/token
      KEYCLOAK_ISSUER_URI: https://${DOMAIN}/auth/realms/factorymind
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/auth/realms/factorymind/protocol/openid-connect/certs
    depends_on:
      db-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy

  api-gateway:
    image: ${IMAGE_PREFIX}/api-gateway:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      <<: *observability
      ASSET_SERVICE_URL: http://asset-service:8081
      TELEMETRY_SERVICE_URL: http://telemetry-service:8082
      ALERT_SERVICE_URL: http://alert-service:8083
      MAINTENANCE_SERVICE_URL: http://maintenance-service:8084
      INVENTORY_SERVICE_URL: http://inventory-service:8086
      AI_INSIGHTS_SERVICE_URL: http://ai-insights-service:8087
      ANALYTICS_SERVICE_URL: http://analytics-service:8088
      NOTIFICATION_SERVICE_URL: http://notification-service:8089
      CORS_ALLOWED_ORIGINS: https://${DOMAIN}
      KEYCLOAK_ISSUER_URI: https://${DOMAIN}/auth/realms/factorymind
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/auth/realms/factorymind/protocol/openid-connect/certs
    depends_on:
      - asset-service
      - telemetry-service
      - alert-service
      - maintenance-service
      - inventory-service
      - ai-insights-service
      - analytics-service
      - notification-service

  web:
    image: ${IMAGE_PREFIX}/web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - api-gateway

  # Observability (ADR 0008). Nothing here is published: Grafana is served by Caddy at https://$DOMAIN/grafana.
  prometheus:
    image: prom/prometheus:v3.15.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
      - --enable-feature=exemplar-storage
      - --web.enable-remote-write-receiver
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infrastructure/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus

  alertmanager:
    image: prom/alertmanager:v0.34.1
    restart: unless-stopped
    entrypoint:
      - /bin/sh
      - -c
      - printf '%s' "$$ALERTMANAGER_WEBHOOK_TOKEN" > /tmp/webhook-token &&
        exec /bin/alertmanager --config.file=/etc/alertmanager/alertmanager.yml --storage.path=/alertmanager
    environment:
      ALERTMANAGER_WEBHOOK_TOKEN: ${ALERTMANAGER_WEBHOOK_TOKEN:?set ALERTMANAGER_WEBHOOK_TOKEN in .env}
    volumes:
      - ./infrastructure/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager

  tempo:
    image: grafana/tempo:2.10.10
    restart: unless-stopped
    command: ["-config.file=/etc/tempo.yml"]
    user: "0"
    volumes:
      - ./infrastructure/tempo/tempo.yml:/etc/tempo.yml:ro
      - tempo-data:/var/tempo

  grafana:
    image: grafana/grafana:13.2.5
    restart: unless-stopped
    environment:
      GF_SERVER_ROOT_URL: https://${DOMAIN}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/plant-operations.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - tempo

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - web
      - keycloak
      - grafana

volumes:
  postgres-data:
  kafka-data:
  caddy-data:
  prometheus-data:
  tempo-data:
  grafana-data:
  alertmanager-data:
