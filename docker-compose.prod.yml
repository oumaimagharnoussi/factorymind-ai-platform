# Production: images come from GitHub Container Registry (built by .github/workflows/deploy.yml).
# Only Caddy is reachable from the internet; it serves HTTPS and forwards to the Angular/nginx container.
name: factorymind

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: factorymind
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init-databases.sql:/docker-entrypoint-initdb.d/01-init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      retries: 10

  asset-service:
    image: ${IMAGE_PREFIX}/asset-service:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      ASSET_DB_URL: jdbc:postgresql://postgres:5432/asset_db
      ASSET_DB_USER: ${POSTGRES_USER}
      ASSET_DB_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy

  api-gateway:
    image: ${IMAGE_PREFIX}/api-gateway:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      ASSET_SERVICE_URL: http://asset-service:8081
      CORS_ALLOWED_ORIGINS: https://${DOMAIN}
    depends_on:
      - asset-service

  web:
    image: ${IMAGE_PREFIX}/web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - api-gateway

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - web

volumes:
  postgres-data:
  caddy-data:
