name: ml-ci

on:
  push:
    paths: ["ml/**", ".github/workflows/ml-ci.yml"]
  pull_request:
    paths: ["ml/**", ".github/workflows/ml-ci.yml"]

defaults:
  run:
    working-directory: ml/predictive-maintenance

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: ml/predictive-maintenance/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      # The full training run, with the metrics in the job log.
      - run: python -m factorymind_ml.train --out model
