name: factorymind

# Shared by every Spring Boot service: send traces to Tempo (metrics are pulled by Prometheus).
x-observability: &observability
  MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT: http://tempo:4318/v1/traces
  TRACING_SAMPLING_PROBABILITY: ${TRACING_SAMPLING_PROBABILITY:-1.0}

services:
  postgres:
    # Postgres 17 with the pgvector extension (embeddings of the copilot's knowledge base).
    image: pgvector/pgvector:0.8.1-pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-factorymind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-factorymind}
      POSTGRES_DB: factorymind
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      retries: 10

  # Creates the per-service databases that are missing, then exits.
  db-init:
    image: postgres:17-alpine
    command: psql -v ON_ERROR_STOP=1 -h postgres -U ${POSTGRES_USER:-factorymind} -d factorymind -f /init-databases.sql
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-factorymind}
    volumes:
      - ./infrastructure/postgres/init-databases.sql:/init-databases.sql:ro
    depends_on:
      postgres:
        condition: service_healthy

  # Single-node Kafka in KRaft mode (no ZooKeeper). Containers use kafka:29092, apps started from the IDE use localhost:9092.
  kafka:
    image: apache/kafka:4.3.1
    environment:
      CLUSTER_ID: y99an3bgT1quyd0vbekr7g  # any 22-character base64 UUID (kafka-storage.sh random-uuid)
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Each service declares the topics it owns (partitions, compaction); a typo must not create a new one.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports:
      - "9092:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null"]
      interval: 10s
      timeout: 10s
      retries: 10

  # Topics, messages and consumer lag in the browser: http://localhost:8085
  kafka-ui:
    image: kafbat/kafka-ui:v1.5.0
    environment:
      KAFKA_CLUSTERS_0_NAME: factorymind
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    ports:
      - "8085:8080"
    depends_on:
      kafka:
        condition: service_healthy

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    # Dev mode keeps its data inside the container: the realm is re-imported on every fresh start.
    command: start-dev --import-realm --http-relative-path=/auth
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      # Tokens always carry this issuer, whether the browser or a container asked for them.
      KC_HOSTNAME: http://localhost:8180/auth
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    ports:
      - "8180:8080"
    volumes:
      - ./infrastructure/keycloak/factorymind-realm.json:/opt/keycloak/data/import/factorymind-realm.json:ro

  asset-service:
    build:
      context: ./backend
      args:
        MODULE: asset-service
    environment:
      <<: *observability
      ASSET_DB_URL: jdbc:postgresql://postgres:5432/asset_db
      ASSET_DB_USER: ${POSTGRES_USER:-factorymind}
      ASSET_DB_PASSWORD: ${POSTGRES_PASSWORD:-factorymind}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KEYCLOAK_ISSUER_URI: http://localhost:8180/auth/realms/factorymind
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/auth/realms/factorymind/protocol/openid-connect/certs
    ports:
      - "8081:8081"
    depends_on:
      db-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      keycloak:
        condition: service_started

  telemetry-service:
    build:
      context: ./backend
      args:
        MODULE: telemetry-service
    environment:
      <<: *observability
      TELEMETRY_DB_URL: jdbc:postgresql://postgres:5432/telemetry_db
      TELEMETRY_DB_USER: ${POSTGRES_USER:-factorymind}
      TELEMETRY_DB_PASSWORD: ${POSTGRES_PASSWORD:-factorymind}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KEYCLOAK_ISSUER_URI: http://localhost:8180/auth/realms/factorymind
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/auth/realms/factorymind/protocol/openid-connect/certs
      # Demo: fake sensors for the machines of the demo data. Turn off when real readings come in.
      SIMULATOR_ENABLED: ${SIMULATOR_ENABLED:-true}
    ports:
      - "8082:8082"
    depends_on:
      db-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      keycloak:
        condition: service_started

  alert-service:
    build:
      context: ./backend
      args:
        MODULE: alert-service
    environment:
      <<: *observability
      ALERT_DB_URL: jdbc:postgresql://postgres:5432/alert_db
      ALERT_DB_USER: ${POSTGRES_USER:-factorymind}
      ALERT_DB_PASSWORD: ${POSTGRES_PASSWORD:-factorymind}
      ALERT_RAISE_AFTER: ${ALERT_RAISE_AFTER:-PT15S}
      ALERT_CLEAR_AFTER: ${ALERT_CLEAR_AFTER:-PT30S}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KEYCLOAK_ISSUER_URI: http://localhost:8180/auth/realms/factorymind
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/auth/realms/factorymind/protocol/openid-connect/certs
    ports:
      - "8083:8083"
    depends_on:
      db-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      keycloak:
        condition: service_started

  maintenance-service:
    build:
      context: ./backend
      args:
        MODULE: maintenance-service
    environment:
      <<: *observability
      MAINTENANCE_DB_URL: jdbc:postgresql://postgres:5432/maintenance_db
      MAINTENANCE_DB_USER: ${POSTGRES_USER:-factorymind}
      MAINTENANCE_DB_PASSWORD: ${POSTGRES_PASSWORD:-factorymind}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      INVENTORY_SERVICE_URL: http://inventory-service:8086
      KEYCLOAK_ISSUER_URI: http://localhost:8180/auth/realms/factorymind
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/auth/realms/factorymind/protocol/openid-connect/certs
    ports:
      - "8084:8084"
    depends_on:
      db-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      keycloak:
        condition: service_started
      inventory-service:
        condition: service_started

  inventory-service:
    build:
      context: ./backend
      args:
        MODULE: inventory-service
    environment:
      <<: *observability
      INVENTORY_DB_URL: jdbc:postgresql://postgres:5432/inventory_db
      INVENTORY_DB_USER: ${POSTGRES_USER:-factorymind}
      INVENTORY_DB_PASSWORD: ${POSTGRES_PASSWORD:-factorymind}
      KEYCLOAK_ISSUER_URI: http://localhost:8180/auth/realms/factorymind
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/auth/realms/factorymind/protocol/openid-connect/certs
    ports:
      - "8086:8086"
    depends_on:
      db-init:
        condition: service_completed_successfully
      keycloak:
        condition: service_started

  # Python failure-risk model (scikit-learn + FastAPI). Trained while the image builds; internal only.
  ml-service:
    build: ./ml/predictive-maintenance
    ports:
      - "8090:8090"

  ai-insights-service:
    build:
      context: ./backend
      args:
        MODULE: ai-insights-service
    environment:
      <<: *observability
      INSIGHTS_DB_URL: jdbc:postgresql://postgres:5432/insights_db
      INSIGHTS_DB_USER: ${POSTGRES_USER:-factorymind}
      INSIGHTS_DB_PASSWORD: ${POSTGRES_PASSWORD:-factorymind}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      ML_SERVICE_URL: http://ml-service:8090
      ASSET_SERVICE_URL: http://asset-service:8081
      AI_CHAT_PROVIDER: ${AI_CHAT_PROVIDER:-none}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5-5}
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
      AI_EMBEDDING_PROVIDER: ${AI_EMBEDDING_PROVIDER:-none}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
      KEYCLOAK_ISSUER_URI: http://localhost:8180/auth/realms/factorymind
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/auth/realms/factorymind/protocol/openid-connect/certs
    ports:
      - "8087:8087"
    depends_on:
      db-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      keycloak:
        condition: service_started
      ml-service:
        condition: service_healthy

  # Optional free local models: docker compose --profile ollama up -d, then once:
  #   docker compose exec ollama ollama pull llama3.2           (chat, about 2 GB)    -> AI_CHAT_PROVIDER=ollama
  #   docker compose exec ollama ollama pull nomic-embed-text   (embeddings, 270 MB)  -> AI_EMBEDDING_PROVIDER=ollama
  analytics-service:
    build:
      context: ./backend
      args:
        MODULE: analytics-service
    environment:
      <<: *observability
      ANALYTICS_DB_URL: jdbc:postgresql://postgres:5432/analytics_db
      ANALYTICS_DB_USER: ${POSTGRES_USER:-factorymind}
      ANALYTICS_DB_PASSWORD: ${POSTGRES_PASSWORD:-factorymind}
      # Read-only connections to the service databases (the pipeline sets every session read-only).
      ASSET_DB_URL: jdbc:postgresql://postgres:5432/asset_db
      TELEMETRY_DB_URL: jdbc:postgresql://postgres:5432/telemetry_db
      ALERT_DB_URL: jdbc:postgresql://postgres:5432/alert_db
      MAINTENANCE_DB_URL: jdbc:postgresql://postgres:5432/maintenance_db
      INSIGHTS_DB_URL: jdbc:postgresql://postgres:5432/insights_db
      SOURCE_DB_USER: ${POSTGRES_USER:-factorymind}
      SOURCE_DB_PASSWORD: ${POSTGRES_PASSWORD:-factorymind}
      ANALYTICS_REFRESH_INTERVAL: ${ANALYTICS_REFRESH_INTERVAL:-PT5M}
      ANALYTICS_DEMO_HISTORY: ${ANALYTICS_DEMO_HISTORY:-true}
      POWERBI_REPORT_URL: ${POWERBI_REPORT_URL:-}
      KEYCLOAK_ISSUER_URI: http://localhost:8180/auth/realms/factorymind
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/auth/realms/factorymind/protocol/openid-connect/certs
    ports:
      - "8088:8088"
    depends_on:
      db-init:
        condition: service_completed_successfully
      keycloak:
        condition: service_started

  ollama:
    image: ollama/ollama:0.40.3
    profiles: ["ollama"]
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama

  api-gateway:
    build:
      context: ./backend
      args:
        MODULE: api-gateway
    environment:
      <<: *observability
      ASSET_SERVICE_URL: http://asset-service:8081
      TELEMETRY_SERVICE_URL: http://telemetry-service:8082
      ALERT_SERVICE_URL: http://alert-service:8083
      MAINTENANCE_SERVICE_URL: http://maintenance-service:8084
      INVENTORY_SERVICE_URL: http://inventory-service:8086
      AI_INSIGHTS_SERVICE_URL: http://ai-insights-service:8087
      ANALYTICS_SERVICE_URL: http://analytics-service:8088
      CORS_ALLOWED_ORIGINS: http://localhost:4200
      KEYCLOAK_ISSUER_URI: http://localhost:8180/auth/realms/factorymind
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/auth/realms/factorymind/protocol/openid-connect/certs
    ports:
      - "8080:8080"
    depends_on:
      - asset-service
      - telemetry-service
      - alert-service
      - maintenance-service
      - inventory-service
      - ai-insights-service
      - analytics-service
      - keycloak

  web:
    build: ./frontend/factorymind-web
    ports:
      - "4200:80"
    depends_on:
      - api-gateway

  # Observability (ADR 0008): metrics in Prometheus, traces in Tempo, both in Grafana.
  prometheus:
    image: prom/prometheus:v3.15.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
      # Exemplars link a latency point to its trace; the remote-write receiver takes Tempo's service graph.
      - --enable-feature=exemplar-storage
      - --web.enable-remote-write-receiver
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infrastructure/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus

  tempo:
    image: grafana/tempo:2.10.10
    command: ["-config.file=/etc/tempo.yml"]
    # Runs as root so it can write to the named volume on Docker Desktop.
    user: "0"
    ports:
      - "3200:3200"   # Tempo API (Grafana)
      - "4318:4318"   # OTLP over HTTP: services started from the IDE send their traces here
    volumes:
      - ./infrastructure/tempo/tempo.yml:/etc/tempo.yml:ro
      - tempo-data:/var/tempo

  grafana:
    image: grafana/grafana:13.2.5
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      # Demo: dashboards open without a login (read-only); sign in as admin to edit.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/plant-operations.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    ports:
      - "3000:3000"
    volumes:
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - tempo

  # Next phases: notification-service, redis.

volumes:
  postgres-data:
  kafka-data:
  ollama-data:
  prometheus-data:
  tempo-data:
  grafana-data:
