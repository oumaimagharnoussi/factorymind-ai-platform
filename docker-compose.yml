name: factorymind

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-factorymind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-factorymind}
      POSTGRES_DB: factorymind
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init-databases.sql:/docker-entrypoint-initdb.d/01-init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      retries: 10

  asset-service:
    build:
      context: ./backend
      args:
        MODULE: asset-service
    environment:
      ASSET_DB_URL: jdbc:postgresql://postgres:5432/asset_db
      ASSET_DB_USER: ${POSTGRES_USER:-factorymind}
      ASSET_DB_PASSWORD: ${POSTGRES_PASSWORD:-factorymind}
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy

  api-gateway:
    build:
      context: ./backend
      args:
        MODULE: api-gateway
    environment:
      ASSET_SERVICE_URL: http://asset-service:8081
      CORS_ALLOWED_ORIGINS: http://localhost:4200
    ports:
      - "8080:8080"
    depends_on:
      - asset-service

  web:
    build: ./frontend/factorymind-web
    ports:
      - "4200:80"
    depends_on:
      - api-gateway

  # Next phases: kafka, keycloak, redis, telemetry-service, prometheus, grafana.

volumes:
  postgres-data:
