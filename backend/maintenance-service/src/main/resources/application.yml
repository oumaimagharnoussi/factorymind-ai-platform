server:
  port: ${SERVER_PORT:8084}

spring:
  application:
    name: maintenance-service
  security:
    oauth2:
      resourceserver:
        jwt:
          # Must equal the "iss" claim of the tokens the browser gets from Keycloak.
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/auth/realms/factorymind}
          # Signing keys; inside Docker this goes to keycloak:8080 while the issuer stays the public URL.
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8180/auth/realms/factorymind/protocol/openid-connect/certs}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # Bytes in, objects out: KafkaConfig's message converter maps JSON to each listener's parameter type.
      value-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer
    producer:
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      properties:
        spring.json.add.type.headers: false
        max.block.ms: 5000
  datasource:
    url: ${MAINTENANCE_DB_URL:jdbc:postgresql://localhost:5432/maintenance_db}
    username: ${MAINTENANCE_DB_USER:factorymind}
    password: ${MAINTENANCE_DB_PASSWORD:factorymind}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    # db/demo holds a few sample work orders; set FLYWAY_LOCATIONS=classpath:db/migration to start empty.
    locations: ${FLYWAY_LOCATIONS:classpath:db/migration,classpath:db/demo}

maintenance:
  # Spare parts are taken out of stock synchronously when a technician books them on a work order.
  inventory-url: ${INVENTORY_SERVICE_URL:http://localhost:8086}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
