server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: asset-service
  security:
    oauth2:
      resourceserver:
        jwt:
          # Must equal the "iss" claim of the tokens the browser gets from Keycloak.
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/auth/realms/factorymind}
          # Signing keys; inside Docker this goes to keycloak:8080 while the issuer stays the public URL.
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8180/auth/realms/factorymind/protocol/openid-connect/certs}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    # Trace context travels in the record headers, so one trace follows a reading across services.
    template:
      observation-enabled: true
    listener:
      observation-enabled: true
    producer:
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      properties:
        # Plain JSON: consumers map it to their own classes, not to com.factorymind.asset types.
        spring.json.add.type.headers: false
        # Fail fast instead of blocking a request thread for a minute when Kafka is down.
        max.block.ms: 5000
  datasource:
    url: ${ASSET_DB_URL:jdbc:postgresql://localhost:5432/asset_db}
    username: ${ASSET_DB_USER:factorymind}
    password: ${ASSET_DB_PASSWORD:factorymind}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    # db/demo holds sample factories and machines; set FLYWAY_LOCATIONS=classpath:db/migration to start empty.
    locations: ${FLYWAY_LOCATIONS:classpath:db/migration,classpath:db/demo}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  # Observability (see docs/adr/0008): Prometheus scrapes /actuator/prometheus; every metric carries the service name.
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      # Latency buckets so Grafana can show p95 / p99 per endpoint.
      percentiles-histogram:
        http.server.requests: true
        http.client.requests: true
  # Metrics are pulled by Prometheus, not pushed over OTLP; OTLP carries the traces only.
  otlp:
    metrics:
      export:
        enabled: false
  observations:
    enable:
      # One span per security filter on every request is noise in Tempo; the request span is enough.
      spring.security: false
  tracing:
    # Every request is traced in the demo; lower it under real load (for example 0.1).
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  # Traces are exported only when MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT is set
  # (docker compose: http://tempo:4318/v1/traces). Without it, trace ids still appear in the logs.

springdoc:
  swagger-ui:
    path: /swagger-ui.html
