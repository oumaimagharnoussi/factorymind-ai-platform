server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: api-gateway
  security:
    oauth2:
      resourceserver:
        jwt:
          # Must equal the "iss" claim of the tokens the browser gets from Keycloak.
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/auth/realms/factorymind}
          # Signing keys; inside Docker this goes to keycloak:8080 while the issuer stays the public URL.
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8180/auth/realms/factorymind/protocol/openid-connect/certs}
  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            cors-configurations:
              '[/api/**]':
                allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
                allowed-methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
                allowed-headers: ["*"]
                exposed-headers: [Location]
          routes:
            - id: asset-service
              uri: ${ASSET_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/factories/**,/api/production-lines/**,/api/assets/**
            # Includes /api/telemetry/stream: the gateway streams Server-Sent Events through as they come.
            - id: telemetry-service
              uri: ${TELEMETRY_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/telemetry/**
            # Includes /api/alerts/stream (Server-Sent Events), like telemetry.
            - id: alert-service
              uri: ${ALERT_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/alerts/**
            - id: maintenance-service
              uri: ${MAINTENANCE_SERVICE_URL:http://localhost:8084}
              predicates:
                - Path=/api/maintenance/**
            - id: inventory-service
              uri: ${INVENTORY_SERVICE_URL:http://localhost:8086}
              predicates:
                - Path=/api/inventory/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
