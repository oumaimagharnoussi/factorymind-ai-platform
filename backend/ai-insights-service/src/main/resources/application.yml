server:
  port: ${SERVER_PORT:8087}

spring:
  application:
    name: ai-insights-service
  security:
    oauth2:
      resourceserver:
        jwt:
          # Must equal the "iss" claim of the tokens the browser gets from Keycloak.
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/auth/realms/factorymind}
          # Signing keys; inside Docker this goes to keycloak:8080 while the issuer stays the public URL.
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8180/auth/realms/factorymind/protocol/openid-connect/certs}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      # Readings and sensor definitions rewind on start anyway (see their listeners).
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # Bytes in, objects out: KafkaConfig's message converter maps JSON to each listener's parameter type.
      value-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer
    producer:
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      properties:
        spring.json.add.type.headers: false
        max.block.ms: 5000
  datasource:
    url: ${INSIGHTS_DB_URL:jdbc:postgresql://localhost:5432/insights_db}
    username: ${INSIGHTS_DB_USER:factorymind}
    password: ${INSIGHTS_DB_PASSWORD:factorymind}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  ai:
    model:
      # anthropic (needs ANTHROPIC_API_KEY), ollama (local, free) or none (rule-based reports, copilot finds passages only).
      chat: ${AI_CHAT_PROVIDER:none}
      # ollama (nomic-embed-text: the copilot also searches by meaning) or none (keyword search only).
      # Anthropic has no embedding model: with Claude for chat, embeddings still come from Ollama.
      embedding: ${AI_EMBEDDING_PROVIDER:none}
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
      chat:
        model: ${ANTHROPIC_MODEL:claude-sonnet-5-5}
        max-tokens: 1024
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        model: ${OLLAMA_MODEL:llama3.2}
      embedding:
        # 768 dimensions, the width of knowledge_chunks.embedding.
        model: ${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}

insights:
  # The Python model service (ml/predictive-maintenance).
  model-url: ${ML_SERVICE_URL:http://localhost:8090}
  # Names of machines for reports and answers.
  asset-url: ${ASSET_SERVICE_URL:http://localhost:8081}
  # Readings the model sees for each sensor. The demo simulator squeezes a machine's wear into 6 minutes,
  # so 2 minutes is a long window here; on a real plant wear takes days and this would be hours.
  window: ${INSIGHTS_WINDOW:PT2M}
  scoring-interval: ${INSIGHTS_SCORING_INTERVAL:PT10S}
  # How long the risk history is kept.
  retention: ${INSIGHTS_RETENTION:P3D}
  knowledge:
    # Characters per passage: long enough to hold a procedure step with its context, short enough to be precise.
    chunk-size: 1000
    # nomic-embed-text expects these task prefixes; clear them for another embedding model.
    query-prefix: "${KNOWLEDGE_QUERY_PREFIX:search_query: }"
    document-prefix: "${KNOWLEDGE_DOCUMENT_PREFIX:search_document: }"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
