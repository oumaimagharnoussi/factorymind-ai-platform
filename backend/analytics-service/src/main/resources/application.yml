server:
  port: ${SERVER_PORT:8088}

spring:
  application:
    name: analytics-service
  security:
    oauth2:
      resourceserver:
        jwt:
          # Must equal the "iss" claim of the tokens the browser gets from Keycloak.
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/auth/realms/factorymind}
          # Signing keys; inside Docker this goes to keycloak:8080 while the issuer stays the public URL.
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8180/auth/realms/factorymind/protocol/openid-connect/certs}
  # The warehouse. Power BI connects to this database too (schema bi).
  datasource:
    url: ${ANALYTICS_DB_URL:jdbc:postgresql://localhost:5432/analytics_db}
    username: ${ANALYTICS_DB_USER:factorymind}
    password: ${ANALYTICS_DB_PASSWORD:factorymind}

analytics:
  # The service databases, read with read-only connections.
  sources:
    asset:
      url: ${ASSET_DB_URL:jdbc:postgresql://localhost:5432/asset_db}
      username: ${SOURCE_DB_USER:factorymind}
      password: ${SOURCE_DB_PASSWORD:factorymind}
    telemetry:
      url: ${TELEMETRY_DB_URL:jdbc:postgresql://localhost:5432/telemetry_db}
      username: ${SOURCE_DB_USER:factorymind}
      password: ${SOURCE_DB_PASSWORD:factorymind}
    alert:
      url: ${ALERT_DB_URL:jdbc:postgresql://localhost:5432/alert_db}
      username: ${SOURCE_DB_USER:factorymind}
      password: ${SOURCE_DB_PASSWORD:factorymind}
    maintenance:
      url: ${MAINTENANCE_DB_URL:jdbc:postgresql://localhost:5432/maintenance_db}
      username: ${SOURCE_DB_USER:factorymind}
      password: ${SOURCE_DB_PASSWORD:factorymind}
    insights:
      url: ${INSIGHTS_DB_URL:jdbc:postgresql://localhost:5432/insights_db}
      username: ${SOURCE_DB_USER:factorymind}
      password: ${SOURCE_DB_PASSWORD:factorymind}
  initial-delay: ${ANALYTICS_INITIAL_DELAY:PT20S}
  refresh-interval: ${ANALYTICS_REFRESH_INTERVAL:PT5M}
  labor-rate-per-hour: ${ANALYTICS_LABOR_RATE:35.00}
  prediction-window: PT24H
  demo-history:
    # Simulated past months so the reports show trends on a fresh install (rows marked SIMULATED).
    enabled: ${ANALYTICS_DEMO_HISTORY:true}
    days: ${ANALYTICS_DEMO_HISTORY_DAYS:180}
  # Link to the published Power BI report, shown on the analytics page when set.
  power-bi-report-url: ${POWERBI_REPORT_URL:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
