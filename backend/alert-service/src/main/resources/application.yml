server:
  port: ${SERVER_PORT:8083}

spring:
  application:
    name: alert-service
  security:
    oauth2:
      resourceserver:
        jwt:
          # Must equal the "iss" claim of the tokens the browser gets from Keycloak.
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/auth/realms/factorymind}
          # Signing keys; inside Docker this goes to keycloak:8080 while the issuer stays the public URL.
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8180/auth/realms/factorymind/protocol/openid-connect/certs}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # Bytes in, objects out: KafkaConfig's message converter maps JSON to each listener's parameter type.
      value-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer
    producer:
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      properties:
        spring.json.add.type.headers: false
        max.block.ms: 5000
  datasource:
    url: ${ALERT_DB_URL:jdbc:postgresql://localhost:5432/alert_db}
    username: ${ALERT_DB_USER:factorymind}
    password: ${ALERT_DB_PASSWORD:factorymind}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC

alert:
  # Debounce of sensor levels before an alert is raised or cleared (see docs/adr/0004).
  debounce:
    raise-after: ${ALERT_RAISE_AFTER:PT15S}
    clear-after: ${ALERT_CLEAR_AFTER:PT30S}
    check-interval: ${ALERT_CHECK_INTERVAL:PT2S}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
