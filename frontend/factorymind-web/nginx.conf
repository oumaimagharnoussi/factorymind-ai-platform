server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Same-origin API calls: the browser talks to nginx, nginx forwards to the gateway.
    location /api/ {
        # Manuals uploaded to the copilot's knowledge base can be up to 10 MB (nginx default: 1 MB).
        client_max_body_size 11m;
        proxy_pass http://api-gateway:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Live readings (Server-Sent Events): pass every event on at once instead of buffering the response.
    location /api/telemetry/stream {
        proxy_pass http://api-gateway:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    # Angular routes such as /assets/123 are client-side.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
