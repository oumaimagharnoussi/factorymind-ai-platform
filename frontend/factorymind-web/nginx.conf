server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Same-origin API calls: the browser talks to nginx, nginx forwards to the gateway.
    location /api/ {
        proxy_pass http://api-gateway:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Angular routes such as /assets/123 are client-side.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
