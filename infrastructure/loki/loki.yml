# Loki stores the logs of every FactoryMind container (collected by Alloy, infrastructure/alloy/config.alloy).
# Single process, files on a volume, 7 days kept. Query them in Grafana > Explore > Loki. See docs/adr/0010.
auth_enabled: false   # one tenant ("fake") for the whole platform

server:
  http_listen_port: 3100
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules

schema_config:
  configs:
    - from: "2026-01-01"
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: 168h
  # The trace id travels as structured metadata: searchable, but not an index label (one per request).
  allow_structured_metadata: true
  volume_enabled: true
  reject_old_samples: true
  reject_old_samples_max_age: 168h

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

# Log-based alert rules (rules/fake/*.yml) go to the same Alertmanager as Prometheus,
# then to notification-service (ADR 0009).
ruler:
  storage:
    type: local
    local:
      directory: /etc/loki/rules
  rule_path: /tmp/loki-rules
  alertmanager_url: http://alertmanager:9093
  enable_api: true
  evaluation_interval: 1m

analytics:
  reporting_enabled: false
